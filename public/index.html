<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth form { display: grid; gap: 10px; }
    .auth label { display: grid; gap: 4px; font-size: 14px; color: #bfd0e5; }
    .auth input { padding: 10px 12px; border: 1px solid #51667c; border-radius: 8px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    .auth button { padding: 10px 14px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    .auth .who { margin: 0 0 12px; }
    #note-form { display: grid; gap: 10px; margin-bottom: 18px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row button { padding: 6px 12px; border: 1px solid #51667c; border-radius: 8px; background: transparent; color: #ecf4ff; cursor: pointer; }
    .row button.danger { border-color: #d07384; color: #ffb4c0; }
    li input { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 8px 10px; border: 1px solid #51667c; border-radius: 8px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    #auth-error { margin: 10px 0 0; color: #ffb4c0; font-size: 15px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인</div>
    <h1>자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>

    <section class="auth" aria-live="polite">
      <form id="login-form">
        <label>이메일 <input id="email" type="email" autocomplete="email" required></label>
        <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">로그인</button>
      </form>
      <div id="signed-in" hidden>
        <p class="who">로그인됨: <span id="who"></span></p>
        <button id="logout" type="button">로그아웃</button>
      </div>
      <p id="auth-error" role="alert" hidden></p>
    </section>

    <div class="notice">서버는 로그인 증표를 직접 검사합니다. 로그인하지 않으면 자료가 보이지 않습니다. 가상 메모만 적어 주세요.</div>
    <form id="note-form" class="auth" hidden>
      <label>제목 <input id="note-title" maxlength="120" required></label>
      <label>내용 <input id="note-body" maxlength="2000"></label>
      <button type="submit">메모 추가</button>
    </form>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    // 공개용 주소와 공개 키(publishable)입니다. 서버 전용 키는 이 파일에 넣지 않습니다.
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';

    const SUPABASE_URL = 'https://miwfnbbjzevrdvnamklb.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_2CNOwFz33tsHOnD5zkWu0g_qE7_J7ky';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.querySelector('#login-form');
    const signedIn = document.querySelector('#signed-in');
    const who = document.querySelector('#who');
    const errorBox = document.querySelector('#auth-error');

    const reasons = {
      invalid_credentials: '이메일 또는 비밀번호가 맞지 않습니다.',
      email_not_confirmed: '이메일 확인이 끝나지 않은 계정입니다.',
      over_request_rate_limit: '요청이 너무 많습니다. 잠시 뒤 다시 시도해 주세요.',
    };
    function showError(error) {
      errorBox.textContent = `로그인에 실패했습니다: ${reasons[error?.code] ?? error?.message ?? '알 수 없는 오류'}`;
      errorBox.hidden = false;
    }
    function render(session) {
      const loggedIn = Boolean(session?.user);
      form.hidden = loggedIn;
      signedIn.hidden = !loggedIn;
      who.textContent = loggedIn ? (session.user.email ?? '이름 없는 계정') : '';
      if (loggedIn) errorBox.hidden = true;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      const { error } = await supabase.auth.signInWithPassword({
        email: form.elements.email.value.trim(),
        password: form.elements.password.value,
      });
      form.elements.password.value = '';
      if (error) showError(error);
    });
    document.querySelector('#logout').addEventListener('click', async () => {
      const { error } = await supabase.auth.signOut();
      if (error) showError(error);
    });
    supabase.auth.onAuthStateChange((_event, session) => render(session));
    render((await supabase.auth.getSession()).data.session);

    const list = document.querySelector('#notes');
    function showMessage(text) {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    }
    const noteForm = document.querySelector('#note-form');
    let currentSession = null;

    // 로그인 증표를 실어 서버에 요청합니다. 서버가 증표를 직접 검사하고, 틀리면 자료를 주지 않습니다.
    async function api(path, options = {}) {
      const response = await fetch(path, {
        cache: 'no-store',
        ...options,
        headers: {
          Authorization: `Bearer ${currentSession.access_token}`,
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        },
      });
      if (response.status === 401) throw new Error('로그인 확인에 실패했습니다. 다시 로그인해 주세요.');
      if (!response.ok) throw new Error('서버에서 요청을 처리하지 못했습니다.');
      return response.json();
    }

    function button(label, onClick, className = '') {
      const el = document.createElement('button');
      el.type = 'button';
      el.textContent = label;
      el.className = className;
      el.addEventListener('click', onClick);
      return el;
    }

    function renderNote(note) {
      const item = document.createElement('li');
      const show = () => {
        const title = document.createElement('strong');
        const body = document.createElement('span');
        title.textContent = note.title;
        body.textContent = note.body;
        const row = document.createElement('div');
        row.className = 'row';
        row.append(button('수정', edit), button('삭제', remove, 'danger'));
        item.replaceChildren(title, body, row);
      };
      const edit = () => {
        const title = document.createElement('input');
        const body = document.createElement('input');
        title.value = note.title;
        body.value = note.body;
        const row = document.createElement('div');
        row.className = 'row';
        row.append(button('저장', async () => {
          try {
            Object.assign(note, await api(`/api/notes/${note.id}`, {
              method: 'PUT', body: JSON.stringify({ title: title.value, body: body.value }),
            }));
            show();
          } catch (error) { showMessage(error.message); }
        }), button('취소', show));
        item.replaceChildren(title, body, row);
      };
      const remove = async () => {
        try {
          await api(`/api/notes/${note.id}`, { method: 'DELETE' });
          item.remove();
          if (!list.children.length) showMessage('아직 내 메모가 없습니다. 위에서 추가해 보세요.');
        } catch (error) { showMessage(error.message); }
      };
      show();
      return item;
    }

    async function loadNotes(session) {
      currentSession = session?.access_token ? session : null;
      noteForm.hidden = !currentSession;
      if (!currentSession) {
        showMessage('로그인하면 가상 자료를 볼 수 있습니다.');
        return;
      }
      try {
        const notes = await api('/api/notes');
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) return showMessage('아직 내 메모가 없습니다. 위에서 추가해 보세요.');
        list.replaceChildren(...notes.map(renderNote));
      } catch (error) {
        showMessage(error.message);
      }
    }

    noteForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        await api('/api/notes', {
          method: 'POST',
          body: JSON.stringify({ title: noteForm.elements['note-title'].value, body: noteForm.elements['note-body'].value }),
        });
        noteForm.reset();
        await loadNotes(currentSession);
      } catch (error) { showMessage(error.message); }
    });

    supabase.auth.onAuthStateChange((_event, session) => { loadNotes(session); });
    await loadNotes((await supabase.auth.getSession()).data.session);
  </script>
</body>
</html>
